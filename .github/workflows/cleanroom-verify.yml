name: Clean-room verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sealed conformance kit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('conformance-kit')
          for line in (root/'SHA256SUMS.txt').read_text(encoding='utf-8-sig').splitlines():
              if not line.strip(): continue
              expected, rel = line.split('  ', 1)
              actual = hashlib.sha256((root/rel).read_bytes()).hexdigest()
              if actual != expected: raise SystemExit(f'checksum mismatch: {rel}')
          print('sealed conformance kit: SHA256SUMS PASS')
          PY
      - name: Fetch sealed v3.2 adoption kit
        run: |
          mkdir -p adoption-conformance-kit
          curl -fsSL -o adoption-conformance-kit/ENTITY_V3_2_ADOPTION_CLEANROOM_KIT.min.json https://raw.githubusercontent.com/blackmore-technology-group/ENTITY/ee3587a6e65c2565eaab2e815e85415ab705ea47/protocol/v3/ENTITY_V3_2_ADOPTION_CLEANROOM_KIT.min.json
          echo '44e7a00f910c89aced3b3c1b5e9cba486809ca313e9bfb4b7bc9266095c10c14  adoption-conformance-kit/ENTITY_V3_2_ADOPTION_CLEANROOM_KIT.min.json' | sha256sum -c -
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Compile and run campaigns
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence-ci
          go run ./cmd/entity-verify test | tee evidence-ci/cleanroom-report.json
          go run ./cmd/adoption-v32 | tee evidence-ci/adoption-v3.2-report.json
          grep -q '"vectors_passed": 16' evidence-ci/adoption-v3.2-report.json
          grep -q '1eb59e09ab08da86bfd8584df4a64ba331f7bbbce3d236b9b94f351606c90e18' evidence-ci/adoption-v3.2-report.json
          grep -q '"overall_valid": true' evidence-ci/adoption-v3.2-report.json
          sha256sum evidence-ci/cleanroom-report.json evidence-ci/adoption-v3.2-report.json > evidence-ci/reports.sha256
          git rev-parse HEAD > evidence-ci/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: entity-go-cleanroom-evidence
          path: evidence-ci/
          retention-days: 90
